# Общие правила kroute для всех узлов (lib/gen/route.py). Узел может положить
# свой kroute.toml рядом с платой - тогда берётся он.
# Ширины и зазоры - не здесь, а классами цепей в .kicad_pro (lib/gen/netclass.py):
# их видит и KiCad DRC.

# Шина CAN - дифпарой: две дорожки рядом с постоянным зазором. Выравнивать
# длину не нужно (CAN FD не замечает перекос в доли мм), пользу даёт само
# «вместе рядом». USB-пара находится сама, по именам USB_DP/USB_DM.
[[pair]]
p = "CANH"
n = "CANL"
width = 0.25
gap = 0.25
